services:
  scene-studio:
    build: .
    image: tatterveil-scene-studio:latest
    container_name: tatterveil-scene-studio
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      # Tuned for a multi-core VPS (12 cores / 62 GiB RAM). Adjust down on smaller hosts.
      MAX_WORKERS: "6"
      REGEN_PARALLELISM: "6"
      EXPORT_FFMPEG_WORKERS: "8"
      TZ: UTC
    volumes:
      # Persist all generated data on the host (survives image rebuilds / container recreation)
      - ./projects:/app/projects
      # Standalone Single Image studio output
      - ./singles:/app/singles
      # Standalone Single Voice studio output
      - ./voices:/app/voices
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
