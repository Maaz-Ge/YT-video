services:
  scene-studio:
    build: .
    image: tatterveil-scene-studio:latest
    container_name: tatterveil-scene-studio
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      # Optional overrides (uncomment to change without editing .env)
      # OPENAI_TEXT_MODEL: gpt-5.4-mini
      # IMAGE_MODEL: gpt-image-2
      # MAX_WORKERS: "3"
      # REGEN_PARALLELISM: "4"
      TZ: UTC
    volumes:
      # Persist all generated projects on the host (same folder you used with python app.py)
      - ./projects:/app/projects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
