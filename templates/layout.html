<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ThomCreates — Scene Studio{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="/" class="nav-logo">
      <span class="nav-logo-mark">◈</span>
      <span class="nav-logo-text">ThomCreates</span>
      <span class="nav-logo-sub">SCENE STUDIO</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Studio</a>
      <a href="/#projects" class="nav-link">Projects</a>
    </div>
  </nav>

  <!-- Page content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Tooltip overlay (populated by JS) -->
  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
